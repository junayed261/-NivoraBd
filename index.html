<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Nivora — Smart Choice, Better Life</title>
<meta name="description" content="Nivora — Online Fashion & Lifestyle Store">

<style>
*{box-sizing:border-box}

:root{
--green:#075b3d;
--lime:#9ad957;
--dark:#14211b;
--soft:#f5f8f3;
--muted:#707772;
--border:#e5ebe6;
}

html{scroll-behavior:smooth}

body{
margin:0;
font-family:Arial,"Noto Sans Bengali",sans-serif;
color:var(--dark);
background:#fff;
}

a{text-decoration:none;color:inherit}

/* HEADER */
header{
position:sticky;
top:0;
z-index:100;
background:#fff;
border-bottom:1px solid var(--border);
}

.nav{
max-width:1180px;
height:68px;
margin:auto;
padding:0 18px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:29px;
font-weight:900;
color:var(--green);
}

.logo span{color:var(--lime)}

.nav-links{
display:flex;
gap:25px;
align-items:center;
font-weight:bold;
font-size:14px;
}

.nav-order{
background:var(--green);
color:#fff;
padding:10px 17px;
border-radius:25px;
}

/* HERO */
.hero{
background:linear-gradient(135deg,#eef8e8,#fff);
padding:48px 18px;
}

.hero-inner{
max-width:1180px;
margin:auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
align-items:center;
}

.kicker{
display:inline-block;
background:#e3f2d8;
color:var(--green);
padding:8px 13px;
border-radius:30px;
font-size:11px;
font-weight:bold;
letter-spacing:1.4px;
}

.hero h1{
font-size:56px;
line-height:1.05;
margin:18px 0;
}

.hero h1 span{color:var(--green)}

.hero p{
font-size:18px;
line-height:1.8;
color:var(--muted);
}

.btn{
display:inline-block;
background:var(--green);
color:#fff;
padding:13px 22px;
border-radius:28px;
font-weight:bold;
margin-top:10px;
}

.hero-img{
width:100%;
height:420px;
object-fit:cover;
border-radius:20px;
box-shadow:0 15px 40px #0002;
}

/* TRUST */
.trust{
border-bottom:1px solid var(--border);
}

.trust-grid{
max-width:1180px;
margin:auto;
padding:20px 18px;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
text-align:center;
}

.trust strong{
display:block;
color:var(--green);
margin-bottom:4px;
}

/* SECTION */
.section{
max-width:1180px;
margin:auto;
padding:50px 18px;
}

.section-head{
text-align:center;
margin-bottom:28px;
}

.section-head small{
color:var(--green);
font-weight:bold;
letter-spacing:1.4px;
}

.section-head h2{
font-size:30px;
margin:8px 0;
}

.section-head p{
color:var(--muted);
}

/* CATEGORY */
.category-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
}

.category{
height:220px;
position:relative;
overflow:hidden;
border-radius:18px;
}

.category img{
width:100%;
height:100%;
object-fit:cover;
transition:.3s;
}

.category:hover img{
transform:scale(1.05);
}

.category-name{
position:absolute;
bottom:0;
left:0;
right:0;
padding:25px 18px 18px;
background:linear-gradient(transparent,#000b);
color:#fff;
}

.category-name h3{
margin:0;
font-size:24px;
}

/* FILTER */
.filter-area{
background:var(--soft);
padding:45px 18px 15px;
}

.filters{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
}

.filter-btn{
border:1px solid var(--green);
background:#fff;
color:var(--green);
padding:10px 20px;
border-radius:25px;
font-weight:bold;
cursor:pointer;
}

.filter-btn.active,
.filter-btn:hover{
background:var(--green);
color:#fff;
}

/* PRODUCTS */
.products{
background:var(--soft);
padding:0 18px 55px;
}

.product-grid{
max-width:1180px;
margin:auto;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.card{
background:#fff;
border:1px solid var(--border);
border-radius:15px;
overflow:hidden;
position:relative;
transition:.2s;
}

.card:hover{
transform:translateY(-4px);
box-shadow:0 12px 30px #0001;
}

.sale{
position:absolute;
top:12px;
left:12px;
background:var(--green);
color:#fff;
padding:6px 11px;
border-radius:20px;
font-size:11px;
font-weight:bold;
z-index:2;
}

.product-img{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
display:block;
}

.card-body{
padding:15px;
}

.card h3{
font-size:17px;
margin:0 0 8px;
}

.old{
color:#999;
text-decoration:line-through;
font-size:14px;
}

.price{
font-size:22px;
font-weight:900;
color:var(--green);
margin-top:3px;
}

.order{
width:100%;
text-align:center;
border-radius:9px;
}

/* WHY */
.why{
background:#fff;
padding:50px 18px;
}

.why-grid{
max-width:1180px;
margin:auto;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
}

.why-card{
background:var(--soft);
padding:22px 12px;
text-align:center;
border-radius:15px;
}

.why-card .icon{
font-size:28px;
}

.why-card h3{
color:var(--green);
font-size:16px;
}

.why-card p{
color:var(--muted);
font-size:13px;
line-height:1.5;
}

/* CONTACT */
.contact{
background:var(--green);
color:#fff;
text-align:center;
padding:55px 18px;
}

.contact h2{
font-size:30px;
}

.contact p{
line-height:1.8;
color:#e5f4eb;
}

.contact .btn{
background:#fff;
color:var(--green);
}

/* FOOTER */
footer{
background:var(--dark);
color:#fff;
text-align:center;
padding:28px 15px;
}

footer p{
color:#b8c4be;
font-size:13px;
line-height:1.7;
}

/* WHATSAPP */
.whatsapp{
position:fixed;
right:18px;
bottom:18px;
width:58px;
height:58px;
border-radius:50%;
background:#25d366;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
z-index:200;
box-shadow:0 5px 20px #0003;
}

/* MOBILE */
@media(max-width:760px){

.nav{height:62px}

.logo{font-size:25px}

.nav-links a:not(.nav-order){
display:none;
}

.hero{
padding:32px 14px;
}

.hero-inner{
grid-template-columns:1fr;
gap:25px;
}

.hero h1{
font-size:40px;
}

.hero p{
font-size:16px;
}

.hero-img{
height:320px;
}

.trust-grid{
grid-template-columns:1fr 1fr;
padding:18px 10px;
font-size:12px;
}

.section{
padding:40px 13px;
}

.category-grid{
grid-template-columns:1fr;
gap:12px;
}

.category{
height:180px;
}

.product-grid{
grid-template-columns:1fr 1fr;
gap:10px;
}

.products{
padding-left:10px;
padding-right:10px;
}

.card{
border-radius:11px;
}

.card-body{
padding:10px;
}

.card h3{
font-size:14px;
line-height:1.4;
}

.old{
font-size:11px;
}

.price{
font-size:19px;
}

.order{
font-size:11px;
padding:10px 5px;
}

.sale{
top:8px;
left:8px;
font-size:9px;
padding:5px 8px;
}

.why-grid{
grid-template-columns:1fr 1fr;
gap:10px;
}

.why-card{
padding:17px 7px;
}

.why-card h3{
font-size:14px;
}

.why-card p{
font-size:11px;
}

}
</style>
</head>
